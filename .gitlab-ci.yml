stages:
  - bump
  - build
  - version
  - deploy

variables:
  DEPLOY_HOST: "ubuntu@140.245.113.229"
  DEPLOY_PATH: "/var/www/manthra"
  PKG_CACHE_PATH: "$CI_PROJECT_DIR/.pkg-cache"
  # Redirect electron/electron-builder download caches into the project dir so
  # GitLab can cache them between pipeline runs (~400 MB saved per job).
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.electron-cache"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.electron-builder-cache"

# ── Bump version (manual) ─────────────────────────────────────────────────────
# Trigger manually from GitLab CI → Run Pipeline.
# Set BUMP_TYPE variable to: patch | minor | major
# This commits the version bump with [skip ci] so the commit doesn't re-trigger
# a pipeline, then pushes the tag — the tag triggers build → version → deploy.
#
# Requires GIT_PUSH_TOKEN project variable:
#   Settings → CI/CD → Variables → add GIT_PUSH_TOKEN
#   Value: a project access token with Developer role + write_repository scope

bump:
  stage: bump
  image: node:18-bullseye
  tags:
    - iins-v4-backend
  variables:
    BUMP_TYPE: "patch"
  script:
    - 'git config user.email "ci@manthra"'
    - 'git config user.name "Manthra CI"'
    - 'git remote set-url origin "https://oauth2:${GIT_PUSH_TOKEN}@gitlab.informaticsint.au/infoins-v4/info-ai/manthra.git"'
    - 'npm version $BUMP_TYPE --message "chore: bump to %s [skip ci]"'
    - 'git push origin HEAD:main'
    - 'git push origin --tags'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# ── Build CLI standalone binaries ─────────────────────────────────────────────

build:
  stage: build
  image: node:18-bullseye
  tags:
    - iins-v4-backend
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .pkg-cache/
  script:
    - npm ci
    - npm run build:dist
  artifacts:
    name: "manthra-cli-$CI_COMMIT_SHORT_SHA"
    paths:
      - releases/
      - install.sh
      - web/
      - deploy/nginx.conf
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

