stages:
  - bump
  - build
  - version
  - deploy

variables:
  DEPLOY_HOST: "ubuntu@140.245.113.229"
  DEPLOY_PATH: "/var/www/manthra"
  PKG_CACHE_PATH: "$CI_PROJECT_DIR/.pkg-cache"

# ── Bump version (manual) ─────────────────────────────────────────────────────
# Trigger manually from GitLab CI → Run Pipeline.
# Set BUMP_TYPE variable to: patch | minor | major
# This commits the version bump with [skip ci] so the commit doesn't re-trigger
# a pipeline, then pushes the tag — the tag triggers build → version → deploy.
#
# Requires GIT_PUSH_TOKEN project variable:
#   Settings → CI/CD → Variables → add GIT_PUSH_TOKEN
#   Value: a project access token with Developer role + write_repository scope

bump:
  stage: bump
  image: node:18-bullseye
  tags:
    - iins-v4-backend
  variables:
    BUMP_TYPE: "patch"
  script:
    - 'git config user.email "ci@manthra"'
    - 'git config user.name "Manthra CI"'
    - 'git remote set-url origin "https://oauth2:${GIT_PUSH_TOKEN}@gitlab.informaticsint.au/infoins-v4/info-ai/manthra.git"'
    - 'npm version $BUMP_TYPE --message "chore: bump to %s [skip ci]"'
    - 'git push origin HEAD:main'
    - 'git push origin --tags'
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# ── Build standalone binaries ─────────────────────────────────────────────────

build:
  stage: build
  image: node:18-bullseye
  tags:
    - iins-v4-backend
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .pkg-cache/
  script:
    - npm ci
    - npm run build:dist
  artifacts:
    name: "manthra-$CI_COMMIT_SHORT_SHA"
    paths:
      - releases/
      - install.sh
      - web/
      - deploy/nginx.conf
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ── Generate version.json (tag releases only) ─────────────────────────────────

version:
  stage: version
  image: node:18-alpine
  tags:
    - iins-v4-backend
  needs:
    - build
  script:
    - VERSION=$(node -p "require('./package.json').version")
    - DATE=$(date -u +%Y-%m-%d)
    - echo "{\"version\":\"${VERSION}\",\"date\":\"${DATE}\"}" > web/version.json
    - echo "Generated version.json — v${VERSION} (${DATE})"
  artifacts:
    paths:
      - web/version.json
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ── Deploy to server ───────────────────────────────────────────────────────────
# On tag: includes version.json → users get update notification
# On main push: deploys code changes only, no version.json update

deploy:
  stage: deploy
  image: alpine:3.19
  tags:
    - iins-v4-backend
  needs:
    - job: build
    - job: version
      optional: true
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - ssh $DEPLOY_HOST "mkdir -p $DEPLOY_PATH/releases"
    - rsync -avz --delete releases/ $DEPLOY_HOST:$DEPLOY_PATH/releases/
    - rsync -avz install.sh $DEPLOY_HOST:$DEPLOY_PATH/install
    - rsync -avz web/ $DEPLOY_HOST:$DEPLOY_PATH/
    - rsync -avz deploy/nginx.conf $DEPLOY_HOST:/tmp/manthra-nginx.conf
    - ssh $DEPLOY_HOST "sudo cp /tmp/manthra-nginx.conf /etc/nginx/sites-available/manthra && sudo nginx -t && sudo systemctl reload nginx"
    - echo "Deployed to https://manthra.informaticsint.au"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  environment:
    name: production
    url: https://manthra.informaticsint.au
