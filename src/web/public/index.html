<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manthra — Provider Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">Manthra</span>
        <span class="logo-sub">Provider Management</span>
      </div>
      <nav>
        <button class="nav-btn active" data-view="providers">Providers</button>
        <button class="nav-btn" data-view="settings">Settings</button>
        <button class="nav-btn" data-view="tools">Tools</button>
      </nav>
    </header>

    <main>
      <!-- Providers View -->
      <div id="view-providers" class="view active">
        <div class="view-header">
          <div>
            <h1>AI Providers</h1>
            <p class="subtitle">Configure connections to AI model providers</p>
          </div>
          <button class="btn btn-primary" id="btn-add-provider">+ Add Provider</button>
        </div>

        <div id="providers-grid" class="providers-grid">
          <div class="empty-state" id="providers-empty" style="display:none">
            <div class="empty-icon">🔌</div>
            <h3>No providers configured</h3>
            <p>Add your first AI provider to start using Manthra</p>
            <button class="btn btn-primary" onclick="showAddForm()">+ Add Provider</button>
          </div>
        </div>
      </div>

      <!-- Settings View -->
      <div id="view-settings" class="view">
        <div class="view-header">
          <div>
            <h1>Settings</h1>
            <p class="subtitle">Global configuration for Manthra</p>
          </div>
          <button class="btn btn-primary" id="btn-save-settings">Save Settings</button>
        </div>

        <div class="settings-form card">
          <div class="form-group">
            <label>Active Provider</label>
            <select id="setting-active-provider">
              <option value="">— Select provider —</option>
            </select>
          </div>
          <div class="form-group">
            <label>Active Model</label>
            <input type="text" id="setting-active-model" placeholder="e.g. claude-sonnet-4-6">
          </div>
          <div class="form-group">
            <label>Max Tokens <span class="hint">per response</span></label>
            <input type="number" id="setting-max-tokens" min="256" max="32768" step="256" value="8192">
          </div>
          <div class="form-group">
            <label>Temperature <span class="hint">0 = deterministic, 1 = creative</span></label>
            <input type="range" id="setting-temperature" min="0" max="1" step="0.05" value="0">
            <span id="setting-temperature-val">0</span>
          </div>
        </div>
      </div>

      <!-- Tools View -->
      <div id="view-tools" class="view">
        <div class="view-header">
          <div>
            <h1>Available Tools</h1>
            <p class="subtitle">Tools that Manthra can use when assisting you</p>
          </div>
        </div>
        <div id="tools-list" class="tools-list"></div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Provider Modal -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add Provider</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <form id="provider-form" onsubmit="return false">
          <input type="hidden" id="form-provider-id">

          <div class="form-group">
            <label>Provider Type <span class="required">*</span></label>
            <select id="form-type" onchange="onTypeChange(this.value)" required>
              <option value="">— Select type —</option>
              <option value="anthropic">Anthropic (Claude)</option>
              <option value="openai">OpenAI</option>
              <option value="azure-openai">Azure OpenAI</option>
              <option value="gemini">Google Gemini</option>
              <option value="zen">⚡ ZEN (OpenCode) — has free models</option>
              <option value="openrouter">🔀 OpenRouter — has free models</option>
              <option value="ollama">🟣 Ollama (local)</option>
              <option value="lmstudio">🩵 LM Studio (local)</option>
              <option value="custom-openai">⚙️ Custom OpenAI-compatible</option>
            </select>
          </div>

          <div class="form-group">
            <label>Display Name <span class="required">*</span></label>
            <input type="text" id="form-name" placeholder="e.g. My Anthropic Account" required>
          </div>

          <div class="form-group" id="field-apikey">
            <label>API Key <span class="required">*</span></label>
            <div class="input-with-toggle">
              <input type="password" id="form-apikey" placeholder="sk-..." autocomplete="off">
              <button type="button" class="toggle-visibility" onclick="toggleApiKey()">Show</button>
            </div>
            <p class="field-hint" id="apikey-hint"></p>
          </div>

          <div class="form-group" id="field-baseurl" style="display:none">
            <label>Base URL</label>
            <input type="url" id="form-baseurl" placeholder="http://localhost:11434">
            <p class="field-hint" id="baseurl-hint"></p>
          </div>

          <div class="form-group" id="field-apiversion" style="display:none">
            <label>API Version</label>
            <input type="text" id="form-apiversion" placeholder="2024-02-01">
          </div>

          <div class="form-group" id="field-defaultmodel">
            <label>Default Model</label>
            <div class="model-select-row">
              <input type="text" id="form-defaultmodel" placeholder="e.g. claude-sonnet-4-6">
              <button type="button" class="btn btn-secondary btn-sm" id="btn-list-models" onclick="listModels()" style="display:none">List Models</button>
            </div>
            <div id="models-dropdown" class="models-dropdown" style="display:none"></div>
          </div>

          <div class="form-row">
            <label class="checkbox-label">
              <input type="checkbox" id="form-enabled" checked>
              <span>Enabled</span>
            </label>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <div id="test-result" class="test-result" style="display:none"></div>
        <div class="modal-actions">
          <button class="btn btn-secondary" id="btn-test" onclick="testProvider()">Test Connection</button>
          <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveProvider()">Save Provider</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
