stages:
  - build
  - deploy

variables:
  DEPLOY_HOST: "ubuntu@140.245.113.229"
  DEPLOY_PATH: "/var/www/manthra"
  PKG_CACHE_PATH: "$CI_PROJECT_DIR/.pkg-cache"

# ── Build standalone binaries ─────────────────────────────────────────────────

build:
  stage: build
  image: node:18-bullseye
  tags:
    - iins-v4-backend
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .pkg-cache/
  script:
    - npm ci
    - npm run build:dist
  artifacts:
    name: "manthra-$CI_COMMIT_SHORT_SHA"
    paths:
      - releases/
      - install.sh
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ── Deploy to server ───────────────────────────────────────────────────────────

deploy:
  stage: deploy
  image: alpine:3.19
  tags:
    - iins-v4-backend
  needs:
    - build
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - ssh $DEPLOY_HOST "mkdir -p $DEPLOY_PATH/releases"
    - rsync -avz --delete releases/ $DEPLOY_HOST:$DEPLOY_PATH/releases/
    - rsync -avz install.sh $DEPLOY_HOST:$DEPLOY_PATH/install
    - ssh $DEPLOY_HOST "sudo nginx -t && sudo systemctl reload nginx"
    - echo "Deployed to https://manthra.informaticsint.au"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: production
    url: https://manthra.informaticsint.au
