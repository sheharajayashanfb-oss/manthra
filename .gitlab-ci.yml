# ── Generate version.json ─────────────────────────────────────────────────────

version:
  stage: version
  image: node:18-alpine
  tags:
    - iins-v4-backend
  needs:
    - build
  script:
    - VERSION=$(node -p "require('./package.json').version")
    - DATE=$(date -u +%Y-%m-%d)
    - echo "{\"version\":\"${VERSION}\",\"date\":\"${DATE}\"}" > web/version.json
    - echo "Generated version.json — v${VERSION} (${DATE})"
  artifacts:
    paths:
      - web/version.json
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ── Deploy to server ───────────────────────────────────────────────────────────

deploy:
  stage: deploy
  image: alpine:3.19
  tags:
    - iins-v4-backend
  needs:
    - job: build
    - job: version
      optional: true
    - job: build:electron:win
      optional: true
    - job: build:electron:mac
      optional: true
    # - job: build:electron:linux
    #   optional: true
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    # CLI binaries + install scripts + marketing site
    - ssh $DEPLOY_HOST "mkdir -p $DEPLOY_PATH/releases $DEPLOY_PATH/releases/desktop"
    - rsync -avz --delete --exclude="desktop/" releases/ $DEPLOY_HOST:$DEPLOY_PATH/releases/
    - rsync -avz install.sh $DEPLOY_HOST:$DEPLOY_PATH/install
    - rsync -avz web/ $DEPLOY_HOST:$DEPLOY_PATH/
    - rsync -avz deploy/nginx.conf $DEPLOY_HOST:/tmp/manthra-nginx.conf
    - ssh $DEPLOY_HOST "sudo cp /tmp/manthra-nginx.conf /etc/nginx/sites-available/manthra && sudo nginx -t && sudo systemctl reload nginx"
    # Desktop builds — no --delete so builds from different jobs are additive
    - |
      if ls releases/desktop/*.dmg 2>/dev/null || ls releases/desktop/*.zip 2>/dev/null; then
        echo "Deploying macOS desktop builds..."
        rsync -avz releases/desktop/*.dmg releases/desktop/*.zip releases/desktop/latest-mac.yml \
          $DEPLOY_HOST:$DEPLOY_PATH/releases/desktop/ 2>/dev/null || true
      fi
    - |
      if ls releases/desktop/*.exe 2>/dev/null; then
        echo "Deploying Windows desktop builds..."
        rsync -avz releases/desktop/*.exe $DEPLOY_HOST:$DEPLOY_PATH/releases/desktop/
        if ls releases/desktop/latest.yml 2>/dev/null; then
          rsync -avz releases/desktop/latest.yml $DEPLOY_HOST:$DEPLOY_PATH/releases/desktop/
        fi
      fi
    - |
      if ls releases/desktop/*.AppImage 2>/dev/null; then
        echo "Deploying Linux desktop builds..."
        rsync -avz releases/desktop/*.AppImage $DEPLOY_HOST:$DEPLOY_PATH/releases/desktop/
        if ls releases/desktop/latest-linux.yml 2>/dev/null; then
          rsync -avz releases/desktop/latest-linux.yml $DEPLOY_HOST:$DEPLOY_PATH/releases/desktop/
        fi
      fi
    - echo "Deployed to https://manthra.informaticsint.au"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
  environment:
    name: production
    url: https://manthra.informaticsint.au
