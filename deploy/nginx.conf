# /etc/nginx/sites-available/manthra
# Serves the install script and release binaries.
# Enable: ln -s /etc/nginx/sites-available/manthra /etc/nginx/sites-enabled/manthra

server {
    listen 80;
    server_name manthra.informaticsint.au;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name manthra.informaticsint.au;

    # Let's Encrypt — populated by: sudo certbot --nginx -d manthra.informaticsint.au
    ssl_certificate     /etc/letsencrypt/live/manthra.informaticsint.au/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manthra.informaticsint.au/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/manthra;

    # /install — serve the shell script as plain text (no .sh extension in URL)
    location = /install {
        default_type text/plain;
        try_files /install =404;
    }

    # /releases/ — serve binaries as binary downloads
    location /releases/ {
        add_header Content-Disposition 'attachment';
        try_files $uri =404;
    }

    # root — simple landing page or 404
    location / {
        try_files $uri $uri/ =404;
    }
}
